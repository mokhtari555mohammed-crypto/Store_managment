<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسيير المحل</title><style>
:root{--bg:#f3f1ec;--cd:#fff;--tx:#1f2a2e;--mu:#68757a;--pr:#0b6e5f;--bd:#dedad0;--dg:#b3382c}
[data-t=dark]{--bg:#141a1c;--cd:#1e2629;--tx:#e8eeee;--mu:#97a6a9;--bd:#2f3b3f;--pr:#3dd0b6;--dg:#ff7a6b}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:180px;background:var(--cd);border-inline-end:1px solid var(--bd);padding:10px;flex:none}nav b{display:block;padding:8px;color:var(--pr)}
nav a{display:block;padding:9px 10px;border-radius:6px;cursor:pointer}nav a.on{background:var(--pr);color:#fff}
main{flex:1;padding:14px;min-width:0}h2{margin:0 0 12px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}.g .cd small{color:var(--mu);display:block}.g .cd strong{font-size:17px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--cd)}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}th{color:var(--mu);font-weight:600}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;margin:6px 0}
.b{background:var(--pr);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}.b.g2{background:none;color:var(--tx);border:1px solid var(--bd)}.b.r{background:var(--dg)}.s{padding:3px 8px;font-size:13px;margin:1px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pl{max-height:60vh;overflow:auto;margin-top:8px}.pl div{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between}
.em{color:var(--mu);text-align:center;padding:18px}.low{color:var(--dg);font-weight:700}.ck input{width:auto}.bar{display:flex;gap:6px;align-items:flex-end;height:110px}.bar i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;font-style:normal;gap:2px;height:100%}.bar u{width:100%;background:var(--pr);border-radius:3px 3px 0 0;min-height:2px}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);width:min(420px,94vw)}.row{display:flex;gap:8px;margin-top:10px}.row .b{flex:1}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9}#toast.er{background:var(--dg)}#toast.show{display:block}
#print{display:none}.bar2{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:760px){body{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;padding:6px;border:0;border-bottom:1px solid var(--bd)}nav b{display:none}nav a{white-space:nowrap}.pos{grid-template-columns:1fr}}
@media print{body>*:not(#print){display:none!important}#print{display:block;padding:10px;color:#000}#print table{background:none}}
</style></head><body>
<nav><b id="shopn">🏪 المحل</b><div id="nav" style="display:contents"></div></nav><main id="main"></main><dialog id="dlg"></dialog><div id="toast"></div><div id="print"></div>
<script>
'use strict';
// ===== أدوات عامة =====
const S=['products','customers','suppliers','sales','purchases','expenses','payments','moves','settings'];
const NAV=[['dash','الرئيسية'],['pos','نقطة البيع'],['products','المنتجات'],['sales','الفواتير'],['purchases','المشتريات'],['customers','الزبائن'],['suppliers','الموردون'],['expenses','المصاريف'],['reports','التقارير'],['settings','الإعدادات']];
let db,D={},cfg,view='dash',Q='',cart=[],pc=[],PC={sup:'',inv:'',paid:''},busy=false,POSV={cust:'',disc:'',paid:'',neg:false},RP={};
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const M=v=>(v/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cfg.cur;
const dd=d=>new Date(d).toLocaleDateString('en-CA'),dt=d=>new Date(d).toLocaleString('ar-DZ');
const P=id=>D.products.find(p=>p.id==id);
const c=v=>{const n=Math.round(parseFloat(v)*100);if(!(n>=0))throw Error('قيمة مالية غير صحيحة');return n};
const sc=v=>Math.max(0,Math.round(parseFloat(v)*100)||0);
const int=v=>{const n=parseInt(v);if(!(n>=0))throw Error('كمية غير صحيحة');return n};
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'er show':'show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3200)}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){toast(e.message||'تعذر الحفظ',1)}finally{busy=false}}
// ===== طبقة IndexedDB =====
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('shopdb',1);r.onupgradeneeded=()=>{S.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error||Error('تعذر فتح قاعدة البيانات'))})}
const getAll=s=>new Promise((res,rej)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function tx(ops,clear){return new Promise((res,rej)=>{const names=[...new Set(ops.map(o=>o[0]).concat(clear||[]))];const t=db.transaction(names,'readwrite');(clear||[]).forEach(s=>t.objectStore(s).clear());ops.forEach(([s,o,d])=>d?t.objectStore(s).delete(o):t.objectStore(s).put(o));t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||Error('تعذر الحفظ'))})}
async function load(){for(const s of S)D[s]=await getAll(s);cfg=Object.assign({name:'محلي التجاري',cur:'DZD',addr:'',phone:'',tax:0,taxOn:false,min:5,open:0,nextNo:1,prefix:'INV-'},D.settings.find(x=>x.id=='cfg')||{})}
async function save(ops,clear){await tx(ops,clear);await load();render()}
// ===== الحسابات =====
const okSales=()=>D.sales.filter(s=>s.status=='ok');
const custDebt=id=>sum(okSales().filter(s=>s.cust==id),s=>s.total-s.paid);
const supDebt=id=>sum(D.purchases.filter(p=>p.sup==id),p=>p.total-p.paid);
const cogs=a=>sum(a,s=>sum(s.items,i=>i.q*i.cost));
function cash(){return cfg.open+sum(D.payments.filter(p=>p.type=='in'),p=>p.amount)-sum(D.payments.filter(p=>p.type=='out'),p=>p.amount)-sum(D.expenses.filter(e=>e.method=='cash'),e=>e.amount)}
function totals(){const sub=sum(cart,l=>l.q*l.price),disc=Math.min(sc(POSV.disc),sub),tax=cfg.taxOn?Math.round((sub-disc)*cfg.tax/100):0,total=sub-disc+tax;return{sub,disc,tax,total,paid:POSV.paid===''?total:sc(POSV.paid)}}
// ===== نماذج =====
function form(title,fs,cb){const d=$('#dlg');d.innerHTML=`<form id="f"><h3>${E(title)}</h3>`+fs.map(f=>`<label>${E(f.l)}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${E(o[0])}" ${o[0]==f.v?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" step="any" value="${E(f.v??'')}">`}</label>`).join('')+`<div class="row"><button class="b">حفظ</button><button type="button" class="b g2" onclick="dlg.close()">إلغاء</button></div></form>`;$('#f').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));run(async()=>{await cb(o);d.close()})};d.showModal()}
const ask=(m,fn)=>{if(confirm(m))run(fn)};
// ===== المنتجات =====
function pForm(id){const p=P(id)||{};form(id?'تعديل منتج':'منتج جديد',[{k:'name',l:'الاسم',v:p.name},{k:'sku',l:'الرمز SKU',v:p.sku},{k:'bc',l:'الباركود',v:p.bc},{k:'cat',l:'التصنيف',v:p.cat},{k:'buy',l:'سعر الشراء',t:'number',v:p.buy/100||0},{k:'sell',l:'سعر البيع',t:'number',v:p.sell/100||0},{k:'qty',l:'الكمية الحالية',t:'number',v:p.qty||0},{k:'min',l:'الحد الأدنى',t:'number',v:p.min??cfg.min}],async o=>{
if(!o.name.trim())throw Error('الاسم مطلوب');const n={...p,id:p.id||uid(),name:o.name.trim(),sku:o.sku.trim(),bc:o.bc.trim(),cat:o.cat.trim(),buy:c(o.buy),sell:c(o.sell),qty:int(o.qty),min:int(o.min),added:p.added||Date.now()};
if(n.bc&&D.products.some(x=>x.id!=n.id&&x.bc==n.bc))throw Error('الباركود مستعمل لمنتج آخر');
const ops=[['products',n]],dq=n.qty-(p.qty||0);if(dq)ops.push(['moves',{id:uid(),pid:n.id,q:dq,reason:id?'تعديل يدوي':'رصيد افتتاحي',date:Date.now()}]);await save(ops);toast('تم الحفظ')})}
function pDel(id){if(D.sales.some(s=>s.items.some(i=>i.pid==id))||D.purchases.some(s=>s.items.some(i=>i.pid==id)))return toast('لا يمكن حذف منتج له فواتير؛ اجعل كميته 0',1);ask('حذف المنتج؟',async()=>{await save([['products',id,1]]);toast('تم الحذف')})}
function vProd(){const q=Q.toLowerCase(),a=D.products.filter(p=>[p.name,p.sku,p.bc,p.cat].join(' ').toLowerCase().includes(q));
return`<h2>المنتجات</h2><div class="bar2"><input style="max-width:260px" placeholder="بحث بالاسم/الباركود/الرمز" value="${E(Q)}" onchange="Q=this.value;render()"><button class="b" onclick="pForm()">+ منتج</button></div><div class="tw">${a.length?`<table><tr><th>المنتج</th><th>تصنيف</th><th>شراء</th><th>بيع</th><th>الكمية</th><th></th></tr>${a.map(p=>`<tr><td>${E(p.name)}<br><small>${E(p.sku)} ${E(p.bc)}</small></td><td>${E(p.cat)}</td><td>${M(p.buy)}</td><td>${M(p.sell)}</td><td class="${p.qty<=p.min?'low':''}">${p.qty}${p.qty<=p.min?' ⚠':''}</td><td><button class="b s" onclick="pForm('${p.id}')">تعديل</button><button class="b s r" onclick="pDel('${p.id}')">حذف</button></td></tr>`).join('')}</table>`:'<p class="em">لا توجد منتجات. أضف منتجًا أو حمّل بيانات تجريبية من الإعدادات.</p>'}</div>`}
// ===== نقطة البيع =====
function vPos(){return`<h2>نقطة البيع</h2><div class="pos"><div><input id="ps" placeholder="بحث أو باركود ثم Enter" oninput="posList()" onkeydown="if(event.key=='Enter')posEnter(this)"><div id="pl" class="pl cd"></div></div><div class="cd"><div id="cl"></div><div id="tot"></div><label>الزبون<select onchange="POSV.cust=this.value;totUp()"><option value="">زبون عابر</option>${D.customers.map(x=>`<option value="${x.id}" ${POSV.cust==x.id?'selected':''}>${E(x.name)}</option>`).join('')}</select></label><label>خصم على الفاتورة<input type="number" value="${E(POSV.disc)}" oninput="POSV.disc=this.value;totUp()"></label><label>المبلغ المدفوع (فارغ = كامل المبلغ)<input type="number" value="${E(POSV.paid)}" oninput="POSV.paid=this.value;totUp()"></label><label class="ck"><input type="checkbox" ${POSV.neg?'checked':''} onchange="POSV.neg=this.checked"> السماح بالبيع دون مخزون (يصبح المخزون سالبًا)</label><button class="b" style="width:100%" onclick="checkout()">تأكيد البيع</button></div></div>`}
function posList(){const q=($('#ps').value||'').toLowerCase(),a=D.products.filter(p=>[p.name,p.sku,p.bc].join(' ').toLowerCase().includes(q)).slice(0,40);$('#pl').innerHTML=a.length?a.map(p=>`<div onclick="addCart('${p.id}')"><span>${E(p.name)}</span><span>${M(p.sell)} · ${p.qty}</span></div>`).join(''):'<p class="em">لا نتائج</p>'}
function posEnter(i){const v=i.value.trim(),p=D.products.find(x=>(x.bc&&x.bc==v)||(x.sku&&x.sku==v));if(p){addCart(p.id);i.value='';posList()}}
function addCart(id){const p=P(id),l=cart.find(x=>x.pid==id),q=(l?l.q:0)+1;if(q>p.qty&&!POSV.neg)return toast('الكمية المتوفرة '+p.qty+' فقط',1);l?l.q=q:cart.push({pid:id,q:1,price:p.sell});totUp()}
function cq(i,d){const l=cart[i],p=P(l.pid),q=l.q+d;if(q<1)return;if(q>p.qty&&!POSV.neg)return toast('الكمية غير متوفرة',1);l.q=q;totUp()}
function totUp(){if(!$('#cl'))return;const T=totals();$('#cl').innerHTML=cart.length?`<table>${cart.map((l,i)=>`<tr><td>${E(P(l.pid).name)}</td><td><button class="b s g2" onclick="cq(${i},-1)">-</button> ${l.q} <button class="b s g2" onclick="cq(${i},1)">+</button></td><td>${M(l.q*l.price)}</td><td><button class="b s r" onclick="cart.splice(${i},1);totUp()">×</button></td></tr>`).join('')}</table>`:'<p class="em">السلة فارغة</p>';
$('#tot').innerHTML=`<p>المجموع: ${M(T.sub)}${T.disc?'<br>الخصم: '+M(T.disc):''}${T.tax?'<br>الضريبة: '+M(T.tax):''}<br><b>الإجمالي: ${M(T.total)}</b><br>${T.paid>T.total?'الباقي للزبون: '+M(T.paid-T.total):'المتبقي دينًا: '+M(T.total-T.paid)}</p>`}
function checkout(){run(async()=>{if(!cart.length)throw Error('السلة فارغة');const T=totals(),pm={};
const items=cart.map(l=>{const p=P(l.pid);if(!p)throw Error('منتج غير موجود');if(l.q<=0)throw Error('كمية غير صحيحة');if(l.q>p.qty&&!POSV.neg)throw Error('الكمية غير متوفرة: '+p.name);pm[p.id]=(pm[p.id]||{...p});pm[p.id].qty-=l.q;return{pid:p.id,name:p.name,q:l.q,price:l.price,cost:p.buy}});
const paid=Math.min(T.paid,T.total);if(paid<T.total&&!POSV.cust)throw Error('اختر زبونًا للبيع بالدين أو الدفع الجزئي');
const id=uid(),no=cfg.prefix+String(cfg.nextNo).padStart(5,'0'),now=Date.now();
const ops=[['sales',{id,no,date:now,cust:POSV.cust||null,items,sub:T.sub,disc:T.disc,tax:T.tax,total:T.total,paid,status:'ok'}],['settings',{...cfg,id:'cfg',nextNo:cfg.nextNo+1}]];
Object.values(pm).forEach(p=>ops.push(['products',p]));items.forEach(i=>ops.push(['moves',{id:uid(),pid:i.pid,q:-i.q,reason:'بيع '+no,date:now,ref:id}]));
if(paid>0)ops.push(['payments',{id:uid(),type:'in',amount:paid,date:now,ref:id,kind:'sale'}]);
await save(ops);cart=[];POSV={cust:'',disc:'',paid:'',neg:false};render();toast('تم البيع '+no);printSale(id)})}
// ===== الفواتير =====
function printSale(id){const s=D.sales.find(x=>x.id==id),cu=D.customers.find(x=>x.id==s.cust);$('#print').innerHTML=`<h2 style="text-align:center">${E(cfg.name)}</h2><p style="text-align:center">${E(cfg.addr)} ${E(cfg.phone)}</p><p>فاتورة: ${E(s.no)} — ${dt(s.date)}<br>الزبون: ${E(cu?cu.name:'زبون عابر')}${s.status!='ok'?'<br><b>(ملغاة / مرتجعة)</b>':''}</p><table><tr><th>المنتج</th><th>كمية</th><th>سعر</th><th>مجموع</th></tr>${s.items.map(i=>`<tr><td>${E(i.name)}</td><td>${i.q}</td><td>${M(i.price)}</td><td>${M(i.q*i.price)}</td></tr>`).join('')}</table><p>المجموع: ${M(s.sub)}<br>الخصم: ${M(s.disc)}<br>الضريبة: ${M(s.tax)}<br><b>الإجمالي: ${M(s.total)}</b><br>المدفوع: ${M(s.paid)}<br>المتبقي: ${M(s.total-s.paid)}</p>`;setTimeout(()=>window.print(),50)}
function voidSale(id){ask('إلغاء الفاتورة وإرجاع المخزون ورد المبلغ المدفوع؟',async()=>{const s=D.sales.find(x=>x.id==id);if(s.status!='ok')throw Error('الفاتورة ملغاة مسبقًا');const ops=[['sales',{...s,status:'void',voidDate:Date.now()}]],pm={};
s.items.forEach(i=>{const p=pm[i.pid]||P(i.pid);if(p){pm[i.pid]={...p,qty:p.qty+i.q};ops.push(['moves',{id:uid(),pid:i.pid,q:i.q,reason:'مرتجع '+s.no,date:Date.now(),ref:id}])}});Object.values(pm).forEach(p=>ops.push(['products',p]));
if(s.paid>0)ops.push(['payments',{id:uid(),type:'out',amount:s.paid,date:Date.now(),ref:id,kind:'refund'}]);await save(ops);toast('تم الإلغاء')})}
function vSales(){const a=D.sales.filter(s=>s.no.toLowerCase().includes(Q.toLowerCase())||dd(s.date).includes(Q)).sort((x,y)=>y.date-x.date);
return`<h2>الفواتير</h2><div class="bar2"><input style="max-width:260px" placeholder="رقم الفاتورة أو التاريخ" value="${E(Q)}" onchange="Q=this.value;render()"></div><div class="tw">${a.length?`<table><tr><th>الرقم</th><th>التاريخ</th><th>الزبون</th><th>الإجمالي</th><th>المتبقي</th><th>الحالة</th><th></th></tr>${a.map(s=>{const u=D.customers.find(x=>x.id==s.cust);return`<tr><td>${E(s.no)}</td><td>${dt(s.date)}</td><td>${E(u?u.name:'عابر')}</td><td>${M(s.total)}</td><td>${M(s.status=='ok'?s.total-s.paid:0)}</td><td>${s.status=='ok'?'سارية':'ملغاة/مرتجعة'}</td><td><button class="b s" onclick="printSale('${s.id}')">طباعة</button>${s.status=='ok'?`<button class="b s r" onclick="voidSale('${s.id}')">إلغاء/إرجاع</button>`:''}</td></tr>`}).join('')}</table>`:'<p class="em">لا توجد فواتير بعد.</p>'}</div>`}
// ===== المشتريات =====
function pSync(){if($('#pup')){PC={sup:$('#pup').value,inv:$('#pin').value,paid:$('#ppd').value,date:$('#pdt').value}}}
function pAdd(){try{pSync();const p=P($('#ppr').value);if(!p)throw Error('اختر منتجًا');pc.push({pid:p.id,q:int($('#pq').value)||(()=>{throw Error('الكمية يجب أن تكون أكبر من 0')})(),cost:c($('#pco').value)});render()}catch(e){toast(e.message,1)}}
function pSave(){pSync();run(async()=>{if(!PC.sup)throw Error('اختر موردًا');if(!pc.length)throw Error('أضف منتجات');const total=sum(pc,l=>l.q*l.cost),paid=PC.paid===''?total:c(PC.paid);if(paid>total)throw Error('المدفوع أكبر من الإجمالي');const id=uid(),now=PC.date?new Date(PC.date).getTime():Date.now(),pm={},ops=[];
pc.forEach(l=>{const p=pm[l.pid]||{...P(l.pid)};const nq=p.qty+l.q;p.buy=p.qty>0?Math.round((p.qty*p.buy+l.q*l.cost)/nq):l.cost;p.qty=nq;pm[l.pid]=p;ops.push(['moves',{id:uid(),pid:l.pid,q:l.q,reason:'شراء',date:now,ref:id}])});
Object.values(pm).forEach(p=>ops.push(['products',p]));ops.push(['purchases',{id,sup:PC.sup,inv:PC.inv,date:now,items:pc.map(l=>({...l,name:pm[l.pid].name})),total,paid}]);if(paid>0)ops.push(['payments',{id:uid(),type:'out',amount:paid,date:now,ref:id,kind:'purchase'}]);
await save(ops);pc=[];PC={sup:'',inv:'',paid:''};render();toast('تم تسجيل الشراء')})}
function vPur(){return`<h2>المشتريات</h2><div class="cd"><label>المورد<select id="pup"><option value="">—</option>${D.suppliers.map(x=>`<option value="${x.id}" ${PC.sup==x.id?'selected':''}>${E(x.name)}</option>`).join('')}</select></label><label>رقم فاتورة المورد<input id="pin" value="${E(PC.inv)}"></label><label>التاريخ<input id="pdt" type="date" value="${E(PC.date||dd(Date.now()))}"></label>
<div class="row"><select id="ppr">${D.products.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><input id="pq" type="number" placeholder="كمية"><input id="pco" type="number" placeholder="التكلفة"><button class="b" onclick="pAdd()">+</button></div>
${pc.length?`<table>${pc.map((l,i)=>`<tr><td>${E(P(l.pid).name)}</td><td>${l.q}</td><td>${M(l.cost)}</td><td><button class="b s r" onclick="pSync();pc.splice(${i},1);render()">×</button></td></tr>`).join('')}</table><p><b>الإجمالي: ${M(sum(pc,l=>l.q*l.cost))}</b></p>`:''}<label>المبلغ المدفوع (فارغ = كامل)<input id="ppd" type="number" value="${E(PC.paid)}"></label><button class="b" onclick="pSave()">تأكيد الشراء</button></div>
<h3>سجل المشتريات</h3><div class="tw">${D.purchases.length?`<table><tr><th>التاريخ</th><th>المورد</th><th>فاتورة</th><th>الإجمالي</th><th>المتبقي</th></tr>${[...D.purchases].sort((a,b)=>b.date-a.date).map(p=>{const u=D.suppliers.find(x=>x.id==p.sup);return`<tr><td>${dd(p.date)}</td><td>${E(u?u.name:'')}</td><td>${E(p.inv)}</td><td>${M(p.total)}</td><td>${M(p.total-p.paid)}</td></tr>`}).join('')}</table>`:'<p class="em">لا توجد مشتريات.</p>'}</div>`}
// ===== الزبائن والموردون =====
function partyForm(k,id){const x=D[k].find(y=>y.id==id)||{};form(id?'تعديل':'إضافة',[{k:'name',l:'الاسم',v:x.name},{k:'phone',l:'الهاتف',v:x.phone},{k:'addr',l:'العنوان',v:x.addr},{k:'note',l:'ملاحظات',v:x.note}],async o=>{if(!o.name.trim())throw Error('الاسم مطلوب');await save([[k,{...x,id:x.id||uid(),name:o.name.trim(),phone:o.phone,addr:o.addr,note:o.note}]]);toast('تم الحفظ')})}
function partyDel(k,id){const f=k=='customers'?'cust':'sup';if(D.sales.concat(D.purchases).some(r=>r[f]==id))return toast('له عمليات مسجلة؛ لا يمكن حذفه',1);ask('حذف؟',async()=>{await save([[k,id,1]])})}
function payForm(k,id){const C=k=='customers',debt=C?custDebt(id):supDebt(id);form('تسجيل دفعة — المستحق '+M(debt),[{k:'amt',l:'المبلغ',t:'number'}],async o=>{let a=c(o.amt);if(a<=0)throw Error('المبلغ يجب أن يكون أكبر من 0');if(a>debt)throw Error('المبلغ يتجاوز المستحق');
const list=(C?okSales().filter(s=>s.cust==id):D.purchases.filter(p=>p.sup==id)).filter(x=>x.total>x.paid).sort((x,y)=>x.date-y.date),ops=[];
for(const x of list){if(a<=0)break;const t=Math.min(a,x.total-x.paid);a-=t;ops.push([C?'sales':'purchases',{...x,paid:x.paid+t}],['payments',{id:uid(),type:C?'in':'out',amount:t,date:Date.now(),ref:x.id,kind:'debt',party:id}])}await save(ops);toast('تم تسجيل الدفعة')})}
function vParty(k){const C=k=='customers';return`<h2>${C?'الزبائن':'الموردون'}</h2><div class="bar2"><button class="b" onclick="partyForm('${k}')">+ إضافة</button></div><div class="tw">${D[k].length?`<table><tr><th>الاسم</th><th>الهاتف</th><th>${C?'المشتريات':'المشتريات منه'}</th><th>المدفوع</th><th>المتبقي</th><th></th></tr>${D[k].map(x=>{const r=C?okSales().filter(s=>s.cust==x.id):D.purchases.filter(p=>p.sup==x.id),t=sum(r,y=>y.total),p=sum(r,y=>y.paid);return`<tr><td>${E(x.name)}</td><td>${E(x.phone)}</td><td>${M(t)}</td><td>${M(p)}</td><td class="${t>p?'low':''}">${M(t-p)}</td><td><button class="b s" onclick="payForm('${k}','${x.id}')">دفعة</button><button class="b s g2" onclick="partyForm('${k}','${x.id}')">تعديل</button><button class="b s r" onclick="partyDel('${k}','${x.id}')">حذف</button></td></tr>`}).join('')}</table>`:'<p class="em">لا يوجد سجلات.</p>'}</div>`}
// ===== المصاريف =====
function expForm(){form('مصروف جديد',[{k:'type',l:'النوع (إيجار، كهرباء، نقل…)'},{k:'amt',l:'المبلغ',t:'number'},{k:'date',l:'التاريخ',t:'date',v:dd(Date.now())},{k:'desc',l:'الوصف'},{k:'method',l:'طريقة الدفع',t:'select',v:'cash',o:[['cash','نقدًا'],['other','أخرى (غير الصندوق)']]}],async o=>{if(!o.type.trim())throw Error('النوع مطلوب');const a=c(o.amt);if(a<=0)throw Error('المبلغ يجب أن يكون أكبر من 0');await save([['expenses',{id:uid(),type:o.type.trim(),amount:a,date:new Date(o.date).getTime(),desc:o.desc,method:o.method}]]);toast('تم الحفظ')})}
function vExp(){return`<h2>المصاريف</h2><div class="bar2"><button class="b" onclick="expForm()">+ مصروف</button></div><div class="tw">${D.expenses.length?`<table><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الوصف</th><th></th></tr>${[...D.expenses].sort((a,b)=>b.date-a.date).map(e=>`<tr><td>${dd(e.date)}</td><td>${E(e.type)}</td><td>${M(e.amount)}</td><td>${E(e.desc)}</td><td><button class="b s r" onclick="ask('حذف المصروف؟',async()=>{await save([['expenses','${e.id}',1]])})">حذف</button></td></tr>`).join('')}</table>`:'<p class="em">لا توجد مصاريف.</p>'}</div>`}
// ===== لوحة التحكم =====
function vDash(){const today=dd(Date.now()),mo=today.slice(0,7),ok=okSales(),sT=ok.filter(s=>dd(s.date)==today),sM=ok.filter(s=>dd(s.date).startsWith(mo)),eM=sum(D.expenses.filter(e=>dd(e.date).startsWith(mo)),e=>e.amount);
const low=D.products.filter(p=>p.qty<=p.min),top={};ok.forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));
const days=[...Array(7)].map((_,i)=>{const d=dd(Date.now()-(6-i)*864e5),r=ok.filter(s=>dd(s.date)==d);return{d:d.slice(5),s:sum(r,x=>x.total),p:sum(r,x=>x.total)-cogs(r)}}),mx=Math.max(1,...days.map(x=>x.s));
const cd=(l,v,x)=>`<div class="cd"><small>${l}</small><strong class="${x||''}">${v}</strong></div>`;
return`<h2>لوحة التحكم</h2><div class="g">${cd('مبيعات اليوم',M(sum(sT,s=>s.total)))}${cd('مبيعات الشهر',M(sum(sM,s=>s.total)))}${cd('ربح الشهر التقديري',M(sum(sM,s=>s.total)-cogs(sM)-eM))}${cd('مصاريف الشهر',M(eM))}${cd('إجمالي المشتريات',M(sum(D.purchases,p=>p.total)))}${cd('قيمة المخزون',M(sum(D.products,p=>Math.max(0,p.qty)*p.buy)))}${cd('عدد المنتجات',D.products.length)}${cd('منخفضة المخزون',low.length,low.length?'low':'')}${cd('عدد الفواتير',ok.length)}${cd('ديون الزبائن',M(sum(D.customers,x=>custDebt(x.id))))}${cd('ديون الموردين',M(sum(D.suppliers,x=>supDebt(x.id))))}${cd('رصيد الصندوق المتوقع',M(cash()))}</div>
<div class="cd"><b>المبيعات (أعمدة) آخر 7 أيام</b><div class="bar">${days.map(x=>`<i>${Math.round(x.s/100)}<u style="height:${x.s/mx*80}%"></u>${x.d}</i>`).join('')}</div></div>
${low.length?`<div class="cd" style="margin-top:10px"><b class="low">تنبيه مخزون:</b> ${low.map(p=>E(p.name)+' ('+p.qty+')').join('، ')}</div>`:''}
<div class="cd" style="margin-top:10px"><b>الأكثر مبيعًا</b><br>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>E(x[0])+': '+x[1]).join('<br>')||'<span class="em">لا مبيعات بعد</span>'}</div>
<div class="cd" style="margin-top:10px"><b>آخر المبيعات</b><br>${[...ok].sort((a,b)=>b.date-a.date).slice(0,5).map(s=>E(s.no)+' — '+M(s.total)).join('<br>')||'<span class="em">لا مبيعات بعد</span>'}</div>`}
// ===== التقارير =====
function repData(){const f=new Date((RP.f||dd(Date.now()).slice(0,8)+'01')+'T00:00').getTime(),t=new Date((RP.t||dd(Date.now()))+'T23:59:59').getTime(),inr=x=>x.date>=f&&x.date<=t,all=D.sales.filter(inr),ok=all.filter(s=>s.status=='ok'),rf=all.filter(s=>s.status!='ok'),ex=D.expenses.filter(inr),pu=D.purchases.filter(inr);const gs=sum(ok,s=>s.sub),net=sum(ok,s=>s.total),cg=cogs(ok),exs=sum(ex,e=>e.amount);return{ok,rf,ex,pu,gs,disc:sum(ok,s=>s.disc),net,cg,gp:net-cg,exs,np:net-cg-exs}}
function vRep(){const r=repData(),row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
return`<h2>التقارير</h2><div class="cd"><div class="row"><input type="date" value="${RP.f||dd(Date.now()).slice(0,8)+'01'}" onchange="RP.f=this.value;render()"><input type="date" value="${RP.t||dd(Date.now())}" onchange="RP.t=this.value;render()"></div><table>${row('إجمالي المبيعات',M(r.gs))}${row('الخصومات',M(r.disc))}${row('صافي المبيعات (بعد الخصم والمرتجعات)',M(r.net))}${row('تكلفة البضاعة المباعة',M(r.cg))}${row('الربح الإجمالي',M(r.gp))}${row('المصاريف التشغيلية',M(r.exs))}${row('<b>الربح الصافي التقديري</b>',M(r.np))}${row('فواتير ملغاة/مرتجعة (عدد)',r.rf.length)}${row('مشتريات الفترة (مخزون، ليست مصروفًا)',M(sum(r.pu,p=>p.total)))}${row('رصيد الصندوق المتوقع الحالي',M(cash()))}</table>
<p style="color:var(--mu)">طريقة التكلفة: متوسط التكلفة المرجح؛ تُسجَّل تكلفة الوحدة وقت البيع. الدفعات على الديون القديمة ليست مبيعات جديدة، والمشتريات لا تُحسب مصروفًا.</p>
<div class="bar2"><button class="b" onclick="exportCSV('sales')">CSV المبيعات</button><button class="b" onclick="exportCSV('products')">CSV المخزون</button><button class="b" onclick="exportCSV('expenses')">CSV المصاريف</button><button class="b" onclick="exportCSV('purchases')">CSV المشتريات</button><button class="b g2" onclick="window.print()">طباعة</button></div></div>`}
function csv(n,rows){const q=v=>'"'+String(typeof v=='string'?v.replace(/^[=+\-@]/,"'$&"):v??'').replace(/"/g,'""')+'"',b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n+'.csv';a.click()}
function exportCSV(k){const r=repData(),m=v=>(v/100).toFixed(2);({sales:()=>csv('sales',[['رقم','تاريخ','إجمالي','مدفوع','حالة'],...r.ok.concat(r.rf).map(s=>[s.no,dd(s.date),m(s.total),m(s.paid),s.status])]),products:()=>csv('stock',[['منتج','رمز','باركود','كمية','شراء','بيع'],...D.products.map(p=>[p.name,p.sku,p.bc,p.qty,m(p.buy),m(p.sell)])]),expenses:()=>csv('expenses',[['تاريخ','نوع','مبلغ','وصف'],...r.ex.map(e=>[dd(e.date),e.type,m(e.amount),e.desc])]),purchases:()=>csv('purchases',[['تاريخ','فاتورة','إجمالي','مدفوع'],...r.pu.map(p=>[dd(p.date),p.inv,m(p.total),m(p.paid)])])})[k]()}
// ===== الإعدادات والنسخ الاحتياطي =====
function vSet(){const f=(k,l,t)=>`<label>${l}<input id="c_${k}" type="${t||'text'}" value="${E(cfg[k])}"></label>`;
return`<h2>الإعدادات</h2><div class="cd">${f('name','اسم المحل')}${f('addr','العنوان')}${f('phone','الهاتف')}${f('cur','العملة')}${f('prefix','بادئة ترقيم الفواتير')}${f('min','الحد الأدنى الافتراضي للمخزون','number')}${f('open','رصيد بداية الصندوق','number')}<label class="ck"><input id="c_taxOn" type="checkbox" ${cfg.taxOn?'checked':''}> تفعيل الضريبة</label>${f('tax','نسبة الضريبة %','number')}<button class="b" onclick="saveCfg()">حفظ الإعدادات</button></div>
<div class="cd" style="margin-top:10px"><div class="bar2"><button class="b g2" onclick="theme()">الوضع الداكن/الفاتح</button><button class="b" onclick="backup()">نسخة احتياطية JSON</button><button class="b g2" onclick="$('#imp').click()">استيراد نسخة</button><button class="b g2" onclick="sample()">بيانات تجريبية</button><button class="b r" onclick="wipe()">مسح كل البيانات</button></div><input id="imp" type="file" accept=".json" hidden onchange="importB(this.files[0])">
<p style="color:var(--mu)">⚠ البيانات محفوظة في متصفح هذا الجهاز فقط؛ حذف بيانات المتصفح أو فقدان الجهاز يضيّعها، فأنشئ نسخًا احتياطية بانتظام. كما أن ملف HTML المحلي لا يوفر حماية حقيقية: من يصل إلى الجهاز يستطيع قراءة البيانات أو تعديلها، ولا يوجد تسجيل دخول.</p></div>`}
function saveCfg(){run(async()=>{const g=k=>$('#c_'+k).value,n={...cfg,id:'cfg',name:g('name').trim()||'المحل',addr:g('addr'),phone:g('phone'),cur:g('cur').trim()||'DZD',prefix:g('prefix'),min:int(g('min')),open:c(g('open')||0),taxOn:$('#c_taxOn').checked,tax:Math.max(0,parseFloat(g('tax'))||0)};await save([['settings',n]]);toast('تم الحفظ')})}
function theme(){const t=document.documentElement.dataset.t=='dark'?'light':'dark';document.documentElement.dataset.t=t;try{localStorage.setItem('th',t)}catch(e){}}
function backup(){const d={};S.forEach(s=>d[s]=D[s]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'shop',v:1,date:Date.now(),data:d})],{type:'application/json'}));a.download='backup-'+dd(Date.now())+'.json';a.click();toast('تم إنشاء النسخة')}
async function importB(f){if(!f)return;run(async()=>{let j;try{j=JSON.parse(await f.text())}catch(e){throw Error('ملف غير صالح')}
if(!j||j.app!='shop'||!j.data||S.some(s=>!Array.isArray(j.data[s]||[])))throw Error('بنية النسخة غير صحيحة');
for(const s of S)for(const r of j.data[s]||[])if(!r||typeof r.id!='string')throw Error('سجلات غير صالحة في '+s);
if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟'))return;await save(S.flatMap(s=>(j.data[s]||[]).map(r=>[s,r])),S);toast('تم الاستيراد')});$('#imp').value=''}
function sample(){ask('إضافة بيانات تجريبية؟',async()=>{const n=Date.now(),p=(name,cat,b,s,q)=>['products',{id:uid(),name,sku:'S'+Math.floor(Math.random()*999),bc:'',cat,buy:b*100,sell:s*100,qty:q,min:5,added:n}];await save([p('سكر 1كغ','مواد غذائية',90,110,50),p('زيت 1لتر','مواد غذائية',180,220,30),p('صابون','منظفات',40,60,3),['customers',{id:uid(),name:'زبون تجريبي',phone:'',addr:'',note:''}],['suppliers',{id:uid(),name:'مورد تجريبي',phone:'',addr:'',note:''}]]);toast('تمت الإضافة')})}
function wipe(){if(!confirm('سيتم حذف كل البيانات نهائيًا. هل أنشأت نسخة احتياطية؟'))return;ask('تأكيد أخير: مسح كل البيانات؟',async()=>{await save([],S);toast('تم المسح')})}
// ===== التشغيل =====
const V={dash:vDash,pos:vPos,products:vProd,sales:vSales,purchases:vPur,customers:()=>vParty('customers'),suppliers:()=>vParty('suppliers'),expenses:vExp,reports:vRep,settings:vSet};
function go(v){view=v;Q='';render()}
function render(){$('#shopn').textContent='🏪 '+cfg.name;$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]==view?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');$('#main').innerHTML=V[view]();if(view=='pos'){posList();totUp()}}
(async()=>{try{document.documentElement.dataset.t=localStorage.getItem('th')||'light'}catch(e){}
try{await openDB();await load();render()}catch(e){$('#main').innerHTML='<p class="em">تعذر فتح التخزين المحلي. جرّب فتح الملف في متصفح آخر أو عبر خادم محلي.<br>'+E(e.message)+'</p>'}})();
</script></body></html>
