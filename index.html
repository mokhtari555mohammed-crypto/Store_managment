<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسيير المحل</title><style>
:root{--bg:#f3f1ec;--cd:#fff;--tx:#1f2a2e;--mu:#68757a;--pr:#0b6e5f;--bd:#dedad0;--dg:#b3382c}
[data-t=dark]{--bg:#141a1c;--cd:#1e2629;--tx:#e8eeee;--mu:#97a6a9;--bd:#2f3b3f;--pr:#3dd0b6;--dg:#ff7a6b}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:180px;background:var(--cd);border-inline-end:1px solid var(--bd);padding:10px;flex:none}nav b{display:block;padding:8px;color:var(--pr)}
nav a{display:block;padding:9px 10px;border-radius:6px;cursor:pointer}nav a.on{background:var(--pr);color:#fff}
main{flex:1;padding:14px;min-width:0}h2{margin:0 0 12px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}.g .cd small{color:var(--mu);display:block}.g .cd strong{font-size:17px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--cd)}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}th{color:var(--mu);font-weight:600}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}label{display:block;margin:6px 0}
.b{background:var(--pr);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}.b.g2{background:none;color:var(--tx);border:1px solid var(--bd)}.b.r{background:var(--dg)}.s{padding:3px 8px;font-size:13px;margin:1px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pl{max-height:60vh;overflow:auto;margin-top:8px}.pl div{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between}
.em{color:var(--mu);text-align:center;padding:18px}.low{color:var(--dg);font-weight:700}.ck input{width:auto}.bar{display:flex;gap:6px;align-items:flex-end;height:110px}.bar i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;font-style:normal;gap:2px;height:100%}.bar u{width:100%;background:var(--pr);border-radius:3px 3px 0 0;min-height:2px}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);width:min(420px,94vw)}.row{display:flex;gap:8px;margin-top:10px}.row .b{flex:1}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9}#toast.er{background:var(--dg)}#toast.show{display:block}
#print{display:none}.bar2{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}.th{width:34px;height:34px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-inline-end:6px}.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips a{padding:4px 12px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;white-space:nowrap;background:var(--cd)}.chips a.on{background:var(--pr);color:#fff;border-color:var(--pr)}
@media(max-width:760px){body{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;padding:6px;border:0;border-bottom:1px solid var(--bd)}nav b{display:none}nav a{white-space:nowrap}.pos{grid-template-columns:1fr}}
@media print{body>*{display:none!important}body:not(.rp)>#print{display:block!important;padding:10px;color:#000}body.rp>main{display:block!important}#print table,main table{background:none;color:#000}.bar2,.chips{display:none!important}}
</style></head><body>
<nav><b id="shopn">🏪 المحل</b><small id="licst" style="padding:0 8px;color:var(--mu)"></small><div id="nav" style="display:contents"></div></nav><main id="main"></main><dialog id="dlg"></dialog><div id="toast"></div><div id="print"></div>
<script>
'use strict';
// ===== أدوات عامة =====
const S=['products','customers','suppliers','sales','purchases','expenses','payments','moves','settings'];
const NAV=[['dash','الرئيسية'],['pos','نقطة البيع'],['products','المنتجات'],['moves','حركات المخزون'],['sales','الفواتير'],['purchases','المشتريات'],['customers','الزبائن'],['suppliers','الموردون'],['expenses','المصاريف'],['cash','الصندوق'],['reports','التقارير'],['settings','الإعدادات']];
let db,D={},cfg,view='dash',Q='',cart=[],pc=[],PC={sup:'',inv:'',paid:''},busy=false,POSV={cust:'',disc:'',paid:'',neg:false},RP={},G='',POSG='',SORT='name';
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const M=v=>(v/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cfg.cur;
const dd=d=>new Date(d).toLocaleDateString('en-CA'),dt=d=>new Date(d).toLocaleString('ar-DZ');
const P=id=>D.products.find(p=>p.id==id);
const c=v=>{const n=Math.round(parseFloat(v)*100);if(!(n>=0))throw Error('قيمة مالية غير صحيحة');return n};
const sc=v=>Math.max(0,Math.round(parseFloat(v)*100)||0);
const int=v=>{const n=parseInt(v);if(!(n>=0))throw Error('كمية غير صحيحة');return n};
const shrink=f=>new Promise((res,rej)=>{if(!f.type.startsWith('image/'))return rej(Error('الملف ليس صورة'));const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,200/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',.75))};i.onerror=()=>rej(Error('تعذر قراءة الصورة'));i.src=u});
const im=p=>p.img&&p.img.startsWith('data:image/')?`<img class="th" src="${E(p.img)}" alt="">`:'';
const gList=()=>[...new Set((cfg.groups||[]).concat(D.products.map(p=>p.cat)))].filter(Boolean).sort();
const chips=(cur,fn)=>`<div class="chips"><a class="${cur?'':'on'}" onclick="${fn}('')">الكل</a>${gList().map(g=>`<a class="${cur==g?'on':''}" onclick="${fn}(this.textContent)">${E(g)}</a>`).join('')}</div>`;
const MT=[['cash','نقدًا'],['transfer','تحويل'],['card','بطاقة'],['other','أخرى']];
const SO={name:(x,y)=>x.name.localeCompare(y.name,'ar'),sell:(x,y)=>y.sell-x.sell,qty:(x,y)=>x.qty-y.qty,profit:(x,y)=>(y.sell-y.buy)-(x.sell-x.buy)};
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'er show':'show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3200)}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){toast(e.message||'تعذر الحفظ',1)}finally{busy=false}}
// ===== طبقة IndexedDB =====
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('shopdb',1);r.onupgradeneeded=()=>{S.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error||Error('تعذر فتح قاعدة البيانات'))})}
const getAll=s=>new Promise((res,rej)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function tx(ops,clear){return new Promise((res,rej)=>{const names=[...new Set(ops.map(o=>o[0]).concat(clear||[]))];const t=db.transaction(names,'readwrite');(clear||[]).forEach(s=>t.objectStore(s).clear());ops.forEach(([s,o,d])=>d?t.objectStore(s).delete(o):t.objectStore(s).put(o));t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||Error('تعذر الحفظ'))})}
async function load(){for(const s of S)D[s]=await getAll(s);cfg=Object.assign({name:'محلي التجاري',cur:'DZD',addr:'',phone:'',tax:0,taxOn:false,min:5,open:0,nextNo:1,prefix:'INV-',groups:[]},D.settings.find(x=>x.id=='cfg')||{})}
async function save(ops,clear){await tx(ops,clear);await load();render()}
// ===== الحسابات =====
const okSales=()=>D.sales.filter(s=>s.status=='ok');
const custDebt=id=>sum(okSales().filter(s=>s.cust==id),s=>s.total-s.paid);
const supDebt=id=>sum(D.purchases.filter(p=>p.sup==id),p=>p.total-p.paid);
const cogs=a=>sum(a,s=>sum(s.items,i=>(i.q+(i.dq||0))*i.cost));
function cash(){return cfg.open+sum(D.payments.filter(p=>p.type=='in'&&(p.m||'cash')=='cash'),p=>p.amount)-sum(D.payments.filter(p=>p.type=='out'&&(p.m||'cash')=='cash'),p=>p.amount)-sum(D.expenses.filter(e=>e.method=='cash'),e=>e.amount)}
function totals(){const sub=sum(cart,l=>l.q*l.price),disc=Math.min(sc(POSV.disc),sub),tax=cfg.taxOn?Math.round((sub-disc)*cfg.tax/100):0,total=sub-disc+tax;return{sub,disc,tax,total,paid:POSV.paid===''?total:sc(POSV.paid)}}
// ===== نماذج =====
function form(title,fs,cb){const d=$('#dlg');d.innerHTML=`<form id="f"><h3>${E(title)}</h3>`+fs.map(f=>`<label>${E(f.l)}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${E(o[0])}" ${o[0]==f.v?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" step="any"${f.t=='file'?' accept="image/*"':''} value="${E(f.v??'')}">`}</label>`).join('')+`<div class="row"><button class="b">حفظ</button><button type="button" class="b g2" onclick="dlg.close()">إلغاء</button></div></form>`;$('#f').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));run(async()=>{await cb(o);d.close()})};d.showModal()}
const ask=(m,fn)=>{if(confirm(m))run(fn)};
// ===== المنتجات =====
function pForm(id){const p=P(id)||{};form(id?'تعديل منتج':'منتج جديد',[{k:'name',l:'الاسم',v:p.name},{k:'sku',l:'الرمز SKU',v:p.sku},{k:'bc',l:'الباركود',v:p.bc},{k:'cat',l:'المجموعة',t:'select',v:p.cat||'',o:[['','— بدون —'],...gList().map(g=>[g,g])]},{k:'img',l:'صورة المنتج (اختياري)',t:'file'},{k:'buy',l:'سعر الشراء',t:'number',v:p.buy/100||0},{k:'sell',l:'سعر البيع',t:'number',v:p.sell/100||0},{k:'qty',l:'الكمية الحالية',t:'number',v:p.qty||0},{k:'min',l:'الحد الأدنى',t:'number',v:p.min??cfg.min}],async o=>{
if(!o.name.trim())throw Error('الاسم مطلوب');const img=o.img&&o.img.size?await shrink(o.img):p.img;const n={...p,img,id:p.id||uid(),name:o.name.trim(),sku:o.sku.trim(),bc:o.bc.trim(),cat:o.cat.trim(),buy:c(o.buy),sell:c(o.sell),qty:int(o.qty),min:int(o.min),added:p.added||Date.now()};
if(n.bc&&D.products.some(x=>x.id!=n.id&&x.bc==n.bc))throw Error('الباركود مستعمل لمنتج آخر');
const ops=[['products',n]],dq=n.qty-(p.qty||0);if(dq)ops.push(['moves',{id:uid(),pid:n.id,q:dq,reason:id?'تعديل يدوي':'رصيد افتتاحي',date:Date.now()}]);await save(ops);toast('تم الحفظ')})}
function pDel(id){if(D.sales.some(s=>s.items.some(i=>i.pid==id))||D.purchases.some(s=>s.items.some(i=>i.pid==id)))return toast('لا يمكن حذف منتج له فواتير؛ اجعل كميته 0',1);ask('حذف المنتج؟',async()=>{await save([['products',id,1]]);toast('تم الحذف')})}
function setG(g){G=g;render()}
function setPG(g){POSG=g;render()}
function gMgr(){const d=$('#dlg');d.innerHTML=`<h3>مجموعات المنتجات</h3>${gList().map(g=>`<div class="row" style="align-items:center"><span style="flex:1">${E(g)} (${D.products.filter(p=>p.cat==g).length})</span><button class="b s r" style="flex:none" onclick="gDel(this.dataset.g)" data-g="${E(g)}">حذف</button></div>`).join('')||'<p class="em">لا توجد مجموعات بعد.</p>'}<form id="gf" class="row"><input name="g" placeholder="اسم مجموعة جديدة"><button class="b" style="flex:none">إضافة</button></form><div class="row"><button class="b g2" onclick="dlg.close()">إغلاق</button></div>`;$('#gf').onsubmit=e=>{e.preventDefault();const g=new FormData(e.target).get('g').trim();run(async()=>{if(!g)throw Error('اكتب اسم المجموعة');if(gList().includes(g))throw Error('المجموعة موجودة');await save([['settings',{...cfg,id:'cfg',groups:[...(cfg.groups||[]),g]}]]);gMgr()})};if(!d.open)d.showModal()}
function gDel(g){if(D.products.some(p=>p.cat==g))return toast('المجموعة تحتوي منتجات؛ انقلها إلى مجموعة أخرى أولًا',1);run(async()=>{await save([['settings',{...cfg,id:'cfg',groups:(cfg.groups||[]).filter(x=>x!=g)}]]);gMgr()})}
function vProd(){const q=Q.toLowerCase(),a=D.products.filter(p=>[p.name,p.sku,p.bc,p.cat].join(' ').toLowerCase().includes(q)&&(!G||p.cat==G)).sort(SO[SORT]);
return`<h2>المنتجات</h2><div class="bar2"><input style="max-width:260px" placeholder="بحث بالاسم/الباركود/الرمز" value="${E(Q)}" onchange="Q=this.value;render()"><select style="max-width:170px" onchange="SORT=this.value;render()">${[['name','الاسم'],['sell','السعر'],['qty','الكمية'],['profit','الربح للوحدة']].map(o=>`<option value="${o[0]}" ${SORT==o[0]?'selected':''}>ترتيب: ${o[1]}</option>`).join('')}</select><button class="b" onclick="pForm()">+ منتج</button><button class="b g2" onclick="gMgr()">المجموعات</button></div>${chips(G,'setG')}<div class="tw">${a.length?`<table><tr><th>المنتج</th><th>تصنيف</th><th>شراء</th><th>بيع</th><th>الكمية</th><th></th></tr>${a.map(p=>`<tr><td>${im(p)}${E(p.name)}<br><small>${E(p.sku)} ${E(p.bc)}</small></td><td>${E(p.cat)}</td><td>${M(p.buy)}</td><td>${M(p.sell)}</td><td class="${p.qty<=p.min?'low':''}">${p.qty}${p.qty<=p.min?' ⚠':''}</td><td><button class="b s" onclick="pForm('${p.id}')">تعديل</button><button class="b s g2" onclick="pAdj('${p.id}')">جرد</button><button class="b s r" onclick="pDel('${p.id}')">حذف</button></td></tr>`).join('')}</table>`:'<p class="em">لا توجد منتجات. أضف منتجًا أو حمّل بيانات تجريبية من الإعدادات.</p>'}</div>`}
// ===== نقطة البيع =====
function vPos(){return`<h2>نقطة البيع</h2><div class="pos"><div>${chips(POSG,'setPG')}<input id="ps" placeholder="بحث أو باركود ثم Enter" oninput="posList()" onkeydown="if(event.key=='Enter')posEnter(this)"><div id="pl" class="pl cd"></div></div><div class="cd"><div id="cl"></div><div id="tot"></div><label>الزبون<select onchange="POSV.cust=this.value;totUp()"><option value="">زبون عابر</option>${D.customers.map(x=>`<option value="${x.id}" ${POSV.cust==x.id?'selected':''}>${E(x.name)}</option>`).join('')}</select></label><label>خصم على الفاتورة<input type="number" value="${E(POSV.disc)}" oninput="POSV.disc=this.value;totUp()"></label><label>المبلغ المدفوع (فارغ = كامل المبلغ)<input type="number" value="${E(POSV.paid)}" oninput="POSV.paid=this.value;totUp()"></label><label>طريقة الدفع<select onchange="POSV.m=this.value">${MT.map(o=>`<option value="${o[0]}" ${(POSV.m||'cash')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><label class="ck"><input type="checkbox" ${POSV.neg?'checked':''} onchange="POSV.neg=this.checked"> السماح بالبيع دون مخزون (يصبح المخزون سالبًا)</label><button class="b" style="width:100%" onclick="checkout()">تأكيد البيع</button><div class="row"><button class="b g2" onclick="hold()">تعليق البيع</button>${D.settings.filter(h=>h.id.startsWith('hold')).map(h=>`<button class="b g2" onclick="unhold('${h.id}')">استرجاع (${h.cart.length})</button>`).join('')}</div></div></div>`}
function posList(){const q=($('#ps').value||'').toLowerCase(),a=D.products.filter(p=>[p.name,p.sku,p.bc].join(' ').toLowerCase().includes(q)&&(!POSG||p.cat==POSG)).slice(0,40);$('#pl').innerHTML=a.length?a.map(p=>`<div onclick="addCart('${p.id}')"><span>${im(p)}${E(p.name)}</span><span>${M(p.sell)} · ${p.qty}</span></div>`).join(''):'<p class="em">لا نتائج</p>'}
function posEnter(i){const v=i.value.trim(),p=D.products.find(x=>(x.bc&&x.bc==v)||(x.sku&&x.sku==v));if(p){addCart(p.id);i.value='';posList()}}
function addCart(id){const p=P(id),l=cart.find(x=>x.pid==id),q=(l?l.q:0)+1;if(q>p.qty&&!POSV.neg)return toast('الكمية المتوفرة '+p.qty+' فقط',1);l?l.q=q:cart.push({pid:id,q:1,price:p.sell});totUp()}
function cq(i,d){const l=cart[i],p=P(l.pid),q=l.q+d;if(q<1)return;if(q>p.qty&&!POSV.neg)return toast('الكمية غير متوفرة',1);l.q=q;totUp()}
function totUp(){if(!$('#cl'))return;const T=totals();$('#cl').innerHTML=cart.length?`<table>${cart.map((l,i)=>`<tr><td>${E(P(l.pid).name)}</td><td><button class="b s g2" onclick="cq(${i},-1)">-</button> ${l.q} <button class="b s g2" onclick="cq(${i},1)">+</button></td><td>${M(l.q*l.price)}</td><td><button class="b s r" onclick="cart.splice(${i},1);totUp()">×</button></td></tr>`).join('')}</table>`:'<p class="em">السلة فارغة</p>';
$('#tot').innerHTML=`<p>المجموع: ${M(T.sub)}${T.disc?'<br>الخصم: '+M(T.disc):''}${T.tax?'<br>الضريبة: '+M(T.tax):''}<br><b>الإجمالي: ${M(T.total)}</b><br>${T.paid>T.total?'الباقي للزبون: '+M(T.paid-T.total):'المتبقي دينًا: '+M(T.total-T.paid)}</p>`}
function checkout(){run(async()=>{if(!cart.length)throw Error('السلة فارغة');const T=totals(),pm={};
const items=cart.map(l=>{const p=P(l.pid);if(!p)throw Error('منتج غير موجود');if(l.q<=0)throw Error('كمية غير صحيحة');if(l.q>p.qty&&!POSV.neg)throw Error('الكمية غير متوفرة: '+p.name);pm[p.id]=(pm[p.id]||{...p});pm[p.id].qty-=l.q;return{pid:p.id,name:p.name,q:l.q,price:l.price,cost:p.buy}});
const paid=Math.min(T.paid,T.total);if(paid<T.total&&!POSV.cust)throw Error('اختر زبونًا للبيع بالدين أو الدفع الجزئي');
const id=uid(),no=cfg.prefix+String(cfg.nextNo).padStart(5,'0'),now=Date.now();
const ops=[['sales',{id,no,date:now,cust:POSV.cust||null,items,sub:T.sub,disc:T.disc,tax:T.tax,total:T.total,paid,status:'ok',m:POSV.m||'cash'}],['settings',{...cfg,id:'cfg',nextNo:cfg.nextNo+1}]];
Object.values(pm).forEach(p=>ops.push(['products',p]));items.forEach(i=>ops.push(['moves',{id:uid(),pid:i.pid,q:-i.q,reason:'بيع '+no,date:now,ref:id}]));
if(paid>0)ops.push(['payments',{id:uid(),type:'in',amount:paid,date:now,ref:id,kind:'sale',m:POSV.m||'cash'}]);
